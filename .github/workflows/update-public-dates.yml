name: Update public dates from Gmail

on:
  workflow_dispatch:
  schedule:
    # Approval mail is low-volume; every 6 hours is plenty.
    # Kept away from the bot-stats worker's :37 schedule.
    - cron: "12 */6 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  # Use this same group for every workflow that writes bot data if possible.
  group: spicychat-data-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-gmail-public-dates.txt

      - name: Install Gmail API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-gmail-public-dates.txt

      - name: Scan Gmail approval emails
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          python scripts/update-public-dates-from-gmail.py \
            --summary-file "$RUNNER_TEMP/gmail-public-date-summary.md"

      - name: Add run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/gmail-public-date-summary.md" ]; then
            cat "$RUNNER_TEMP/gmail-public-date-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit safe public-date updates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/bot-public.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No safe public-date changes to commit."
            exit 0
          fi

          git commit -m "Update bot public dates"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Refresh GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
