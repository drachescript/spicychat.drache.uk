name: Update public dates from Gmail

on:
  workflow_dispatch:
    inputs:
      full_rescan:
        description: "Reconcile historical IDs (reuse cached approvals)"
        type: boolean
        default: false
      retry_unresolved:
        description: "Retry quarantined/unparseable messages"
        type: boolean
        default: false
      reset_state:
        description: "Rebuild encrypted state (only for recovery/key change)"
        type: boolean
        default: false
  schedule:
    - cron: "12 */6 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: spicychat-data-writers
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current site
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-gmail-public-dates.txt

      - name: Install Gmail API dependencies
        run: python -m pip install -r scripts/requirements-gmail-public-dates.txt

      - name: Offline regression tests
        run: python -m unittest discover -s tests -p test_gmail_public_dates.py

      - name: Sync Gmail approval emails
        id: sync
        continue-on-error: true
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SYNC_STATE_KEY: ${{ secrets.GMAIL_SYNC_STATE_KEY }}
          FULL_RESCAN: ${{ inputs.full_rescan || false }}
          RETRY_UNRESOLVED: ${{ inputs.retry_unresolved || false }}
          RESET_STATE: ${{ inputs.reset_state || false }}
        run: |
          args=()
          if [[ "$FULL_RESCAN" == "true" ]]; then args+=(--full-rescan); fi
          if [[ "$RETRY_UNRESOLVED" == "true" ]]; then args+=(--retry-unresolved); fi
          if [[ "$RESET_STATE" == "true" ]]; then args+=(--reset-state); fi
          python scripts/update-public-dates-from-gmail.py "${args[@]}" \
            --summary-file "$RUNNER_TEMP/gmail-public-date-summary.md"

      - name: Add run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/gmail-public-date-summary.md" ]; then
            cat "$RUNNER_TEMP/gmail-public-date-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate changed publication data
        if: steps.sync.outcome == 'success' || steps.sync.outcome == 'failure'
        run: |
          if ! git diff --quiet -- assets/data/bot-public.json; then
            python scripts/validate-bot-data.py
          fi

      - name: Commit sync progress and safe dates
        if: steps.sync.outcome == 'success' || steps.sync.outcome == 'failure'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/bot-public.json
          if [ -f .github/gmail-public-date-state.enc ]; then
            git add .github/gmail-public-date-state.enc
          fi
          public_changed=false
          if ! git diff --cached --quiet -- assets/data/bot-public.json; then
            public_changed=true
          fi
          if git diff --cached --quiet; then
            echo "public_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Sync Gmail publication dates and checkpoint"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
          echo "public_changed=$public_changed" >> "$GITHUB_OUTPUT"

      - name: Refresh GitHub Pages
        if: steps.commit.outputs.public_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Surface sync failure after saving progress
        if: steps.sync.outcome == 'failure'
        run: exit 1
