name: Update bot stats

on:
  workflow_dispatch:
  schedule:
    # Testing schedule: every 2 hours (12x/day).
    # After testing, change */2 to */6 for 4x/day.
    - cron: "37 */2 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: bot-stats-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-public-stats.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements-public-stats.txt') }}

      - name: Install updater
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-public-stats.txt
          python -m playwright install chromium

      - name: Check SpicyChat stats
        run: |
          python scripts/update-public-stats.py \
            --creator dragongraf1312 \
            --summary-file "$RUNNER_TEMP/bot-stats-summary.md"

      - name: Add run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bot-stats-summary.md" ]; then
            cat "$RUNNER_TEMP/bot-stats-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated stats
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/data/bot-stats.json \
            assets/data/bot-history.json \
            assets/data/bot-events.json \
            assets/data/bot-discoveries.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No bot stat changes to commit."
            exit 0
          fi

          git commit -m "Update bot stats"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Refresh GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
